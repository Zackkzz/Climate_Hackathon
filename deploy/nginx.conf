worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    client_max_body_size 2m;
    limit_req_zone $binary_remote_addr zone=signin:10m rate=6r/m;
    server {
        listen 8080;
        return 308 https://$host:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location /api/auth/ {
            limit_req zone=signin burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://meterwise:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://meterwise:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
